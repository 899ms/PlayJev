server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jev + LLM API calls go through the bundled node proxy (avoids browser CORS)
    location /api/ {
        proxy_pass http://proxy:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-llm-target $http_x_llm_target;
        proxy_read_timeout 120s;
    }

    # long-lived assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
